name: Scan de Segurança

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bandit-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar o Bandit
        run: pip install bandit

      - name: Rodar o scan de segurança
        run: bandit -r . -f json -o bandit-report.json --exit-zero -x ./tests

      - name: Salvar o relatório como artefato
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
