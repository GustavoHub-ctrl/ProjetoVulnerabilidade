name: Scan de Segurança

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  bandit-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar o Bandit
        run: pip install bandit

      - name: Rodar o scan de segurança
        run: bandit -r . -f json -o bandit-report.json --exit-zero -x ./tests,./scans

      - name: Salvar o relatório como artefato
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Guardar histórico do scan
        run: |
          mkdir -p scans
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H-%M-%SZ")
          cp bandit-report.json "scans/scan-${TIMESTAMP}.json"
          cp bandit-report.json scans/latest.json

      - name: Commitar o histórico no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scans/
          git diff --staged --quiet || git commit -m "chore: atualizar historico de scan [skip ci]"
          git push
